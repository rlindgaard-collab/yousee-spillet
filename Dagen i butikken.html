<script>
/*!
 * Sælgertest YouSee: MOTOR
 * Selvstændigt modul uden afhængigheder. Indsæt på siden, i denne rækkefølge:
 *   en tom div med id="saelgertest" og data-saet="butik", og derefter
 *   først script-tag med src="saelgertest-indhold.js", derefter script-tag med src="saelgertest.js"
 * Valgfrit på div'en:
 *   data-saet="butik|hverdag|..."  hvilket spørgsmålssæt der bruges (standard: butik)
 *   data-oplevelse="liste|kort"    liste = alle svar på én gang (standard), kort = ét svar ad gangen
 *   data-antal="5"                 træk så mange tilfældige spørgsmål fra sættet (standard: alle)
 *   data-cta-url / data-cta-text   knap til sidst (standard står i indholdsfilen)
 * Al tekst, alle typer, spørgsmål og tærskler ligger i saelgertest-indhold.js.
 * Al CSS er afgrænset til .stest og injiceres af scriptet. Skrifttype: YouNik fra elev.yousee.dk.
 */
(function () {
  'use strict';

  var KEYS = ['A', 'B', 'C', 'D', 'E'];

  /* ---------- Tjek af indhold ---------- */

  // Returnerer en liste med fejl. Tom liste = indholdet er i orden.
  function validate(C) {
    var err = [];
    if (!C || !C.types || !C.sets || !C.ui || !C.scoring) return ['Indholdet mangler types, sets, ui eller scoring.'];
    KEYS.forEach(function (k) {
      var T = C.types[k];
      if (!T) { err.push('Typen ' + k + ' mangler.'); return; }
      ['name', 'tagline', 'lidt', 'intro', 'butik', 'husk', 'oplever', 'styrke', 'proev'].forEach(function (f) {
        if (!T[f]) err.push('Typen ' + k + ' mangler feltet "' + f + '".');
      });
      if (!T.bullets || !T.bullets.length) err.push('Typen ' + k + ' mangler punkter (bullets).');
    });
    Object.keys(C.sets).forEach(function (s) {
      var set = C.sets[s];
      if (!set.questions || !set.questions.length) { err.push('Sættet "' + s + '" har ingen spørgsmål.'); return; }
      set.questions.forEach(function (q, i) {
        var where = 'Sæt "' + s + '", spørgsmål ' + (i + 1) + ': ';
        if (!q.title) err.push(where + 'titel mangler.');
        if (!q.scene) err.push(where + 'situation mangler.');
        KEYS.forEach(function (k) {
          if (!q.options || !q.options[k] || !String(q.options[k]).trim()) err.push(where + 'svar for ' + k + ' mangler.');
        });
        Object.keys(q.options || {}).forEach(function (k) {
          if (KEYS.indexOf(k) < 0) err.push(where + 'ukendt svarnøgle "' + k + '".');
        });
      });
    });
    return err;
  }

  /* ---------- Scoring (ren logik, kan testes uden browser) ---------- */

  function computeScores(picks, S) {
    var s = { A: 0, B: 0, C: 0, D: 0, E: 0 };
    picks.forEach(function (p) {
      if (p && p.most) s[p.most] += S.pointsMost;
      if (p && p.least) s[p.least] += S.pointsLeast;
    });
    return s;
  }

  function rank(scores) {
    return KEYS.slice().sort(function (a, b) {
      return scores[b] - scores[a] || KEYS.indexOf(a) - KEYS.indexOf(b);
    });
  }

  // mode: single (én vinder, evt. "men også lidt"), tie (2-3 lige dele), balanced (4+ lige)
  function summarize(scores, S) {
    var order = rank(scores);
    var top = scores[order[0]];
    var tied = order.filter(function (k) { return scores[k] >= top - S.tieGap; });
    if (tied.length >= 4) return { mode: 'balanced', main: [], secondary: [], order: order };
    if (tied.length > 1) return { mode: 'tie', main: tied, secondary: [], order: order };
    var secondary = order.slice(1).filter(function (k) { return scores[k] >= top - S.secondaryGap; }).slice(0, 2);
    return { mode: 'single', main: [order[0]], secondary: secondary, order: order };
  }

  function joinNames(keys, types) {

    if (n.length < 2) return n.join('');
    return n.slice(0, -1).join(', ') + ' og ' + n[n.length - 1];
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {

  function esc(s) {

  }

  function resultHTML(C, set, scores, n, S, ctaUrl, ctaText, withAgain) {
    var U = C.ui, TYPES = C.types;
    var sum = summarize(scores, S);
    var headline;
    if (sum.mode === 'balanced') {
      headline = U.headBalanced;
    } else if (sum.mode === 'tie') {
      headline = esc(U.headTie) + ' <em>' + esc(joinNames(sum.main, TYPES)) + '</em>.';
    } else {
      headline = esc(U.headMost) + ' <em>' + esc(TYPES[sum.main[0]].name) + '</em>' +
        (sum.secondary.length ? esc(U.headAlso) + ' ' + esc(joinNames(sum.secondary, TYPES)) : '') + '.';
    }
    var lidt = sum.mode === 'balanced'
      ? '<div class="st-lidt"><p>' + esc(U.balancedText) + '</p></div>'
      : sum.secondary.length
      ? '<div class="st-lidt">' + sum.secondary.map(function (k) {
        return '<p><b>' + esc(U.lidtPrefix) + ' ' + esc(TYPES[k].name) + ':</b> ' + esc(TYPES[k].lidt) + '.</p>';
      }).join('') + '</div>'
      : '';
    // laveste mulige score = n * pointsLeast, højeste = n * pointsMost
    var lo = n * S.pointsLeast, hi = n * S.pointsMost;
    var bars = sum.order.map(function (k) {
      var pct = Math.max(4, Math.round((scores[k] - lo) / (hi - lo) * 100));
      return '<div class="st-bar-row"><span>' + esc(TYPES[k].name) + '</span>' +
        '<div class="st-track"><i class="' + (sum.main.indexOf(k) > -1 ? 'is-top' : '') + '" style="width:' + pct + '%"></i></div></div>';
    }).join('');

      '<div class="st-dark">' +
      '<span class="st-eyebrow">' + esc(U.resultEyebrow) + '</span>' +
      '<h2 class="st-h2" data-focus>' + headline + '</h2>' +
      lidt +
      '</div>' +
      sum.main.map(function (k) { return typeCard(C, set, k); }).join('') +
      '<div class="st-bars"><p class="st-label">' + esc(U.barsTitle) + '</p>' + bars +
      '<p class="st-small">' + esc(U.barsNote) + '</p></div>' +
      '<div class="st-cta"><p class="st-lead" style="color:#fff">' + esc(U.ctaLead) + '</p>' +
      '<a class="st-btn" href="' + esc(ctaUrl) + '">' + esc(ctaText) + '</a>' +
      '<button class="st-btn is-ghost" type="button" data-act="again" style="border-color:#fff;color:#fff">' + esc(U.again) + '</button></div>' +
      '</div>';
  }

  /* ---------- Visning ---------- */

  function injectStyle() {
    if (document.getElementById('stest-style')) return;
    var st = document.createElement('style');
    st.id = 'stest-style';
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  function mount(root, C) {
    C = C || window.SaelgerTestIndhold;
    var errors = validate(C);
    if (errors.length) {
      root.textContent = 'Testen kan ikke vises lige nu.';
      if (window.console) console.error('Sælgertest, fejl i indhold:\n- ' + errors.join('\n- '));
      return;
    }
    injectStyle();
    root.classList.add('stest');
    var U = C.ui, TYPES = C.types, S = C.scoring;
    var setKey = root.getAttribute('data-saet') || 'butik';
    var set = C.sets[setKey] || C.sets.butik || C.sets[Object.keys(C.sets)[0]];
    var antal = root.getAttribute('data-antal');
    var ctaUrl = root.getAttribute('data-cta-url') || U.ctaUrl;
    var ctaText = root.getAttribute('data-cta-text') || U.ctaText;

    var kort = root.getAttribute('data-oplevelse') === 'kort';
    var state = null;

    function reset() {
      var qs = pickQuestions(set, antal);

        screen: 'intro',
        q: 0,
        tab: 'most',
        questions: qs,
        picks: qs.map(function () { return { most: null, least: null }; }),
        cards: qs.map(function () { return { queue: null, rounds: 0 }; }),
        order: qs.map(function () { return shuffle(KEYS); })

    }

    function focusTop() {
      if (!state.touched) return;
      try {
        var r = root.getBoundingClientRect();
        if (r.top < 0) root.scrollIntoView({ block: 'start' });
        var h = root.querySelector('[data-focus]');
        if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
      } catch (e) { /* ignore */ }
    }

    function render() {
      if (state.screen === 'intro') renderIntro();
      else if (state.screen === 'q') (kort ? renderCards() : renderQuestion());
      else renderResult();
      focusTop();
    }

    function renderIntro() {
      root.innerHTML =
        '<div class="st-screen">' +
        '<div class="st-dark">' +
        '<span class="st-eyebrow">' + esc(U.eyebrow) + '</span>' +
        '<h1 class="st-h1" data-focus>' + U.introTitle + '</h1>' +
        '<p class="st-lead">' + esc(set.intro) + '</p>' +
        '<p class="st-small">' + esc(U.introSmall) + '</p>' +
        '<div class="st-row"><button class="st-btn" data-act="start" type="button">' + esc(U.start) + '</button></div>' +
        '</div></div>';
    }

    function renderQuestion() {
      var i = state.q, q = state.questions[i], total = state.questions.length;
      var opts = state.order[i].map(function (k) {
        return '<button class="st-opt" type="button" data-k="' + k + '" aria-pressed="false">' +
          '<span class="st-tag"></span><span>' + esc(q.options[k]) + '</span></button>';
      }).join('');
      root.innerHTML =
        '<div class="st-screen">' +
        '<div class="st-top"><span class="st-count">' + esc(U.situation) + ' ' + (i + 1) + ' ' + esc(U.of) + ' ' + total + '</span>' +
        '<div class="st-bar" aria-hidden="true"><i style="width:' + (i / total * 100) + '%"></i></div></div>' +
        '<div class="st-q">' +
        '<h2 class="st-qtitle" data-focus>' + esc(q.title) + '</h2>' +
        '<p class="st-scene">' + esc(q.scene) + '</p>' +
        '<p class="st-ask">' + esc(q.ask || U.ask) + '</p>' +
        '</div>' +
        '<div class="st-tabs" role="tablist" aria-label="' + esc(U.tabsLabel) + '">' +
        '<button class="st-tab" type="button" role="tab" data-tab="most"><span class="st-dot"></span>' + esc(U.tabMost) + '</button>' +
        '<button class="st-tab" type="button" role="tab" data-tab="least"><span class="st-dot"></span>' + esc(U.tabLeast) + '</button>' +
        '</div>' +
        '<p class="st-hint" aria-live="polite"></p>' +
        '<div class="st-opts">' + opts + '</div>' +
        '<div class="st-nav">' +
        '<button class="st-btn is-ghost" type="button" data-act="back">' + esc(U.back) + '</button>' +
        '<button class="st-btn" type="button" data-act="next">' + esc(i === total - 1 ? U.finish : U.next) + '</button>' +
        '</div></div>';
      refreshQuestion();
    }

    /* ---------- Oplevelse: kort, ét svar ad gangen ---------- */

    function cardState(i) {
      var c = state.cards[i];
      if (!c.queue) { c.queue = state.order[i].slice(); c.mid = []; c.rounds = 0; }
      return c;
    }

    function renderCards() {
      var i = state.q, q = state.questions[i], total = state.questions.length;
      var p = state.picks[i], c = cardState(i);
      var done = c.queue.length === 0 && p.most && p.least;
      var head =
        '<div class="st-top"><span class="st-count">' + esc(U.situation) + ' ' + (i + 1) + ' ' + esc(U.of) + ' ' + total + '</span>' +
        '<div class="st-bar" aria-hidden="true"><i style="width:' + (i / total * 100) + '%"></i></div></div>' +
        '<div class="st-q">' +
        '<h2 class="st-qtitle" data-focus>' + esc(q.title) + '</h2>' +
        '<p class="st-scene">' + esc(q.scene) + '</p>' +
        '<p class="st-ask">' + esc(q.ask || U.ask) + '</p>' +
        '</div>';
      var nav = '<div class="st-nav">' +
        '<button class="st-btn is-ghost" type="button" data-act="back">' + esc(U.back) + '</button>' +
        (done ? '<button class="st-btn" type="button" data-act="next">' + esc(i === total - 1 ? U.finish : U.next) + '</button>' : '') +
        '</div>';
      var body;
      if (done) {
        var rows = [['most', p.most, U.tabMost], ['least', p.least, U.tabLeast]].map(function (r) {

        body = '<div class="st-picked">' + rows + '<button class="st-linkbtn" type="button" data-act="redo">' + esc(U.redo) + '</button></div>';

        var key = c.queue[0], left = c.queue.length, again = c.rounds > 0;
        var hint = again ? (!p.most && !p.least ? U.cardsNeedBoth : (!p.most ? U.cardsNeedMost : U.cardsNeedLeast)) : U.cardsIntro;
        var label = again ? '' : '<span class="st-cnum">' + esc(U.card) + ' ' + (state.order[i].length - left + 1) + ' ' + esc(U.of) + ' ' + state.order[i].length + '</span>';
        body =
          '<p class="st-hint" aria-live="polite">' + esc(hint) + '</p>' +
          '<div class="st-stack' + (left === 1 ? ' is-last' : '') + '">' +
          '<div class="st-cardx" data-key="' + key + '">' + label +
          '<p class="st-ctext">' + esc(q.options[key]) + '</p></div></div>' +
          '<div class="st-choose">' +
          (again && p.most ? '' : '<button class="st-btn" type="button" data-act="c-most">' + esc(U.tabMost) + '</button>') +
          (again && p.least ? '' : '<button class="st-btn is-orange" type="button" data-act="c-least">' + esc(U.tabLeast) + '</button>') +
          (again ? '' : '<button class="st-btn st-mid" type="button" data-act="c-mid">' + esc(U.cardMid) + '</button>') +
          '</div>';
      }
      root.innerHTML = '<div class="st-screen">' + head + body + nav + '</div>';
    }

    function cardAct(act) {
      var i = state.q, p = state.picks[i], c = cardState(i);
      if (act === 'redo') { p.most = null; p.least = null; state.cards[i].queue = null; return renderCards(); }
      var key = c.queue.shift();
      if (act === 'c-most') { if (p.most) c.mid.push(p.most); p.most = key; }
      else if (act === 'c-least') { if (p.least) c.mid.push(p.least); p.least = key; }
      else c.mid.push(key);
      if (!c.queue.length && !(p.most && p.least)) {
        c.queue = c.mid.filter(function (k) { return k !== p.most && k !== p.least; });
        c.mid = []; c.rounds += 1;
      }
      if (c.rounds > 0 && p.most && p.least) c.queue = [];
      renderCards();
    }

    function refreshQuestion() {
      var p = state.picks[state.q];
      Array.prototype.forEach.call(root.querySelectorAll('.st-tab'), function (t) {
        var kind = t.getAttribute('data-tab');
        t.setAttribute('aria-selected', String(state.tab === kind));
        t.classList.toggle('is-most', kind === 'most' && !!p.most);
        t.classList.toggle('is-least', kind === 'least' && !!p.least);
      });
      Array.prototype.forEach.call(root.querySelectorAll('.st-opt'), function (b) {
        var k = b.getAttribute('data-k');
        var isMost = p.most === k, isLeast = p.least === k;
        b.classList.toggle('is-most', isMost);
        b.classList.toggle('is-least', isLeast);
        b.setAttribute('aria-pressed', String(isMost || isLeast));
        b.querySelector('.st-tag').textContent = isMost ? U.tabMost : (isLeast ? U.tabLeast : '');

      var hint = root.querySelector('.st-hint');
      if (p.most && p.least) hint.textContent = U.hintDone;
      else if (state.tab === 'most') hint.textContent = U.hintMost;
      else hint.textContent = U.hintLeast;
      root.querySelector('[data-act="next"]').disabled = !(p.most && p.least);
    }

    function pick(k) {
      var p = state.picks[state.q], t = state.tab, other = t === 'most' ? 'least' : 'most';
      if (p[t] === k) { p[t] = null; }
      else {
        p[t] = k;
        if (p[other] === k) p[other] = null;
        if (t === 'most' && !p.least) state.tab = 'least';
        else if (t === 'least' && !p.most) state.tab = 'most';
      }
      refreshQuestion();
    }

    function renderResult() {
      root.innerHTML = resultHTML(C, set, computeScores(state.picks, S), state.questions.length, S, ctaUrl, ctaText, true);
    }

    root.addEventListener('click', function (e) {
      var t = e.target.closest('button,[data-act]');
      if (!t || !root.contains(t)) return;
      var act = t.getAttribute('data-act');
      state.touched = true;
      if (t.classList.contains('st-opt')) { pick(t.getAttribute('data-k')); return; }
      if (t.classList.contains('st-tab')) { state.tab = t.getAttribute('data-tab'); refreshQuestion(); return; }
      if (act === 'redo' || act === 'c-most' || act === 'c-least' || act === 'c-mid') { cardAct(act); return; }
      if (act === 'start') { state.screen = 'q'; state.q = 0; state.tab = 'most'; render(); }

        else { state.q -= 1; state.tab = 'most'; }
        render();
      } else if (act === 'next') {
        var p = state.picks[state.q];
        if (!(p.most && p.least)) return;
        if (state.q === state.questions.length - 1) state.screen = 'result';
        else { state.q += 1; state.tab = 'most'; }
        render();
      } else if (act === 'again') { reset(); state.touched = true; render(); }
    });

    reset();
    root.innerHTML = '';
    render();
    root.__stest = { state: function () { return state; } };
  }

  api.mount = mount;
  api.resultHTML = resultHTML;
  api.esc = esc;
  api.injectStyle = injectStyle;
  api.shuffle = shuffle;
  window.SaelgerTest = api;

  function init() {
    var el = document.getElementById('saelgertest');
    if (el) mount(el);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

  function rightWallSVG() {

    g += quad([1005, 298], [1098, 268], [1098, 520], [1003, 478], TC.oak, 6);
    for (i = 1; i < 9; i++) { var px = 1003 + i * 10.5; g += line(px, 298 - (px - 1005) * .33 + 8, px, 478 + (px - 1003) * .445 - 6, TC.oakDD, 2.2, .55); }
    // store reoler
    function bay(x0, x1, yt0, yt1, yb0, yb1, rows, cols) {
      var s = quad([x0, yt0], [x1, yt1], [x1, yb1], [x0, yb0], TC.oak, 7);
      var ix0 = x0 + 14, ix1 = x1 - 14, it0 = yt0 + 18, it1 = yt1 + 18, ib0 = yb0 - 16, ib1 = yb1 - 16;
      s += '<path d="M' + ix0 + ',' + it0 + ' L' + ix1 + ',' + it1 + ' L' + ix1 + ',' + ib1 + ' L' + ix0 + ',' + ib0 + ' Z" fill="' + TC.cream + '" stroke="' + OL + '" stroke-width="3"/>';

    g += bay(1098, 1312, 282, 262, 560, 574, 5, 6);
    var prod = ['#2b8587', '#f28033', '#c9b79c', '#7b5ca7', '#d7b341', '#bf4a33', '#e8e2d2', '#4aa3df'];
    for (j = 0; j < 5; j++) {

      if (j < 3) for (i = 0; i < 6; i++) {

        g += '<rect x="' + cx + '" y="' + f(cy) + '" width="20" height="30" rx="3" fill="' + prod[(i + j * 3) % prod.length] + '" stroke="' + OL + '" stroke-width="2.4"/>';
      }
    }
    // routere på de nederste hylder
    for (j = 3; j < 5; j++) for (i = 0; i < 3; i++) {

      g += line(rx + 8, ry2, rx + 4, ry2 - 18, OL, 2.8) + line(rx + 26, ry2, rx + 30, ry2 - 18, OL, 2.8) + '<rect x="' + rx + '" y="' + ry2 + '" width="40" height="18" rx="4" fill="#fff" stroke="' + OL + '" stroke-width="2.6"/><circle cx="' + (rx + 8) + '" cy="' + (ry2 + 9) + '" r="2" fill="' + '#00b800' + '"/><circle cx="' + (rx + 15) + '" cy="' + (ry2 + 9) + '" r="2" fill="#f28033"/>';

    g += bay(1398, 1494, 246, 230, 594, 620, 5, 3);

    g += '<rect x="1148" y="474" width="64" height="44" rx="3" fill="#2f6f9a" stroke="' + OL + '" stroke-width="3.5"/><rect x="1156" y="482" width="48" height="6" fill="#fff"/><rect x="1156" y="494" width="34" height="4" fill="#cfe7ff"/>';
    return g;
  }

  function roundCounter() {
    var g = '', cx = 1020, y = 452, rx = 80, h = 170, i;
    var d = 'M' + (cx - rx) + ',' + y + ' L' + (cx + rx) + ',' + y + ' L' + (cx + rx) + ',' + (y + h) + ' Q' + cx + ',' + (y + h + 36) + ' ' + (cx - rx) + ',' + (y + h) + ' Z';

  function phoneTableSVG() {

  function floorSVG() {
    var g = '<path d="M0,650 L495,478 L1003,478 L1536,715 L1536,1024 L0,1024 Z" fill="' + TC.oakL + '"/>';
    g += '<defs><clipPath id="sg-fclip"><path d="M0,650 L495,478 L1003,478 L1536,715 L1536,1024 L0,1024 Z"/></clipPath></defs><g clip-path="url(#sg-fclip)">';
    var i, xb, r, y0, y1, k;

    for (xb = -1800; xb <= 3400; xb += 190) g += line(VP.x, VP.y, xb, 1024, TC.oakDD, 2.6, .34);
    // tværfuger i dybden
    var ys = [];
    for (i = 0; i < 16; i++) ys.push(VP.y + 80 / (1 - 0.062 * i));
    for (r = 0; r < ys.length - 1; r++) {
      y0 = ys[r]; y1 = ys[r + 1];
      for (xb = -1800 + ((r * 83) % 190); xb <= 3400; xb += 380) {
        k = (y0 - VP.y) / (1024 - VP.y); var k2 = (y1 - VP.y) / (1024 - VP.y);
        g += line(VP.x + (xb - VP.x) * k, y0, VP.x + (xb - VP.x) * k2, y1, TC.oakDD, 2.4, .3);

      if (r % 3 === 1) {
        var kk = (y0 - VP.y) / (1024 - VP.y), kb = (y1 - VP.y) / (1024 - VP.y), xa = -400 + ((r * 211) % 900);

    g += line(0, 650, 495, 478, OL, 6) + line(1003, 478, 1536, 715, OL, 6);
    return g;
